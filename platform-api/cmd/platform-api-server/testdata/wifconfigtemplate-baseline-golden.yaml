---
# Source: platform-api-server/templates/wifconfigtemplates.yaml
apiVersion: gcp.managed.openshift.io/v1
kind: WIFConfigTemplate
metadata:
  name: "5.0.0"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
spec:
  verified: false
  schemaVersion: 1
  iam:
    naming:
      customRoleIDTemplate: hcp_{infraIDHex}_{role}
      maximumCustomRoleIDLength: 64
      maximumInfraIDLength: 12
      maximumServiceAccountIDLength: 30
      maximumWorkloadIdentityIDLength: 32
      workloadIdentityPoolIDTemplate: '{infraID}-wi-pool'
      workloadIdentityProviderIDTemplate: '{infraID}-k8s-provider'
    requiredComponents:
    - cloud-controller
    - cloud-network
    - ctrlplane-op
    - gcp-pd-csi
    - image-registry
    - ingress-op
    - nodepool-mgmt
    roleBindings:
    - roleReference: hcpCloudControllerProject
      scope:
        kind: Project
      serviceAccountReference: cloud-controller
    - roleReference: hcpCloudNetworkProject
      scope:
        kind: Project
      serviceAccountReference: cloud-network
    - roleReference: hcpControlPlaneProject
      scope:
        kind: Project
      serviceAccountReference: ctrlplane-op
    - roleReference: hcpGCPPDCSIProject
      scope:
        kind: Project
      serviceAccountReference: gcp-pd-csi
    - roleReference: hcpImageRegistryProject
      scope:
        kind: Project
      serviceAccountReference: image-registry
    - roleReference: hcpIngressProject
      scope:
        kind: Project
      serviceAccountReference: ingress-op
    - roleReference: hcpNodePoolProject
      scope:
        kind: Project
      serviceAccountReference: nodepool-mgmt
    roles:
    - name: hcpCloudControllerProject
      permissions:
      - compute.addresses.create
      - compute.addresses.createInternal
      - compute.addresses.delete
      - compute.addresses.deleteInternal
      - compute.addresses.get
      - compute.addresses.list
      - compute.addresses.use
      - compute.addresses.useInternal
      - compute.firewalls.create
      - compute.firewalls.delete
      - compute.firewalls.get
      - compute.firewalls.update
      - compute.forwardingRules.create
      - compute.forwardingRules.delete
      - compute.forwardingRules.get
      - compute.globalOperations.get
      - compute.healthChecks.create
      - compute.healthChecks.delete
      - compute.healthChecks.get
      - compute.healthChecks.update
      - compute.healthChecks.useReadOnly
      - compute.httpHealthChecks.create
      - compute.httpHealthChecks.delete
      - compute.httpHealthChecks.get
      - compute.httpHealthChecks.update
      - compute.httpHealthChecks.useReadOnly
      - compute.instanceGroups.create
      - compute.instanceGroups.delete
      - compute.instanceGroups.get
      - compute.instanceGroups.list
      - compute.instanceGroups.update
      - compute.instanceGroups.use
      - compute.instances.get
      - compute.instances.list
      - compute.instances.use
      - compute.networks.updatePolicy
      - compute.regionBackendServices.create
      - compute.regionBackendServices.delete
      - compute.regionBackendServices.get
      - compute.regionBackendServices.update
      - compute.regionBackendServices.use
      - compute.regionOperations.get
      - compute.subnetworks.use
      - compute.targetPools.addInstance
      - compute.targetPools.create
      - compute.targetPools.delete
      - compute.targetPools.get
      - compute.targetPools.removeInstance
      - compute.targetPools.use
      - compute.zoneOperations.get
      - compute.zones.list
    - name: hcpCloudNetworkProject
      permissions:
      - compute.instances.get
      - compute.instances.updateNetworkInterface
      - compute.subnetworks.get
      - compute.subnetworks.use
      - compute.zoneOperations.get
    - name: hcpControlPlaneProject
      permissions:
      - compute.addresses.createInternal
      - compute.addresses.deleteInternal
      - compute.addresses.get
      - compute.addresses.setLabels
      - compute.addresses.use
      - compute.firewalls.create
      - compute.firewalls.delete
      - compute.firewalls.get
      - compute.firewalls.update
      - compute.forwardingRules.create
      - compute.forwardingRules.delete
      - compute.forwardingRules.get
      - compute.forwardingRules.pscCreate
      - compute.forwardingRules.pscDelete
      - compute.forwardingRules.pscSetLabels
      - compute.forwardingRules.setLabels
      - compute.globalOperations.get
      - compute.networks.get
      - compute.networks.updatePolicy
      - compute.networks.use
      - compute.regionOperations.get
      - compute.regions.get
      - compute.subnetworks.use
      - dns.changes.create
      - dns.managedZones.create
      - dns.managedZones.delete
      - dns.managedZones.get
      - dns.managedZones.list
      - dns.networks.bindPrivateDNSZone
      - dns.resourceRecordSets.create
      - dns.resourceRecordSets.delete
      - dns.resourceRecordSets.list
      - dns.resourceRecordSets.update
      - servicedirectory.namespaces.create
      - servicedirectory.services.create
      - servicedirectory.services.delete
    - name: hcpGCPPDCSIProject
      permissions:
      - compute.diskTypes.list
      - compute.disks.create
      - compute.disks.createSnapshot
      - compute.disks.delete
      - compute.disks.get
      - compute.disks.list
      - compute.disks.resize
      - compute.disks.setLabels
      - compute.disks.update
      - compute.disks.use
      - compute.disks.useReadOnly
      - compute.globalOperations.get
      - compute.images.create
      - compute.images.delete
      - compute.images.get
      - compute.images.list
      - compute.images.setLabels
      - compute.images.useReadOnly
      - compute.instances.attachDisk
      - compute.instances.detachDisk
      - compute.instances.get
      - compute.regionOperations.get
      - compute.snapshots.create
      - compute.snapshots.delete
      - compute.snapshots.get
      - compute.snapshots.list
      - compute.snapshots.setLabels
      - compute.snapshots.useReadOnly
      - compute.zoneOperations.get
      - compute.zones.list
    - name: hcpImageRegistryProject
      permissions:
      - storage.buckets.create
      - storage.buckets.delete
      - storage.buckets.get
      - storage.buckets.list
      - storage.buckets.update
      - storage.objects.create
      - storage.objects.delete
      - storage.objects.get
      - storage.objects.list
    - name: hcpIngressProject
      permissions:
      - dns.changes.create
      - dns.resourceRecordSets.create
      - dns.resourceRecordSets.delete
      - dns.resourceRecordSets.list
      - dns.resourceRecordSets.update
    - name: hcpNodePoolProject
      permissions:
      - compute.disks.create
      - compute.disks.setLabels
      - compute.instances.create
      - compute.instances.delete
      - compute.instances.get
      - compute.instances.setLabels
      - compute.instances.setMetadata
      - compute.instances.setServiceAccount
      - compute.instances.setTags
      - compute.subnetworks.use
      - compute.zoneOperations.get
    serviceAccountRoleBindings:
    - memberServiceAccountReferences:
      - gcp-pd-csi
      - nodepool-mgmt
      role: roles/iam.serviceAccountUser
      scope:
        kind: ServiceAccount
        reference: WorkerServiceAccount
    serviceAccounts:
    - accountIDTemplate: '{infraID}-cloud-controller'
      name: cloud-controller
      workloadIdentitySubjects:
      - system:serviceaccount:kube-system:cloud-controller-manager
    - accountIDTemplate: '{infraID}-cloud-network'
      name: cloud-network
      workloadIdentitySubjects:
      - system:serviceaccount:openshift-cloud-network-config-controller:cloud-network-config-controller
    - accountIDTemplate: '{infraID}-ctrlplane-op'
      name: ctrlplane-op
      workloadIdentitySubjects:
      - system:serviceaccount:kube-system:control-plane-operator
    - accountIDTemplate: '{infraID}-gcp-pd-csi'
      name: gcp-pd-csi
      workloadIdentitySubjects:
      - system:serviceaccount:openshift-cluster-csi-drivers:gcp-pd-csi-driver-controller-sa
    - accountIDTemplate: '{infraID}-image-registry'
      name: image-registry
      workloadIdentitySubjects:
      - system:serviceaccount:openshift-image-registry:cluster-image-registry-operator
      - system:serviceaccount:openshift-image-registry:registry
    - accountIDTemplate: '{infraID}-ingress-op'
      name: ingress-op
      workloadIdentitySubjects:
      - system:serviceaccount:openshift-ingress-operator:ingress-operator
    - accountIDTemplate: '{infraID}-nodepool-mgmt'
      name: nodepool-mgmt
      workloadIdentitySubjects:
      - system:serviceaccount:kube-system:capi-gcp-controller-manager
    workloadIdentityBindings:
      role: roles/iam.workloadIdentityUser
      serviceAccountReferences:
      - cloud-controller
      - cloud-network
      - ctrlplane-op
      - gcp-pd-csi
      - image-registry
      - ingress-op
      - nodepool-mgmt

