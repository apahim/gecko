{{- if .Values.wifConfigTemplates.enabled }}
{{- range .Values.wifConfigTemplates.entries }}
{{- $contractFile := .contractFile | default "files/wifconfigtemplate-project.yaml" }}
{{- $contract := required (printf "IAM contract file %q for entry %q must be present" $contractFile .name) ($.Files.Get $contractFile) | fromYaml }}
---
apiVersion: gcp.managed.openshift.io/v1
kind: WIFConfigTemplate
metadata:
  name: {{ required "wifConfigTemplates.entries[].name is required" .name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
spec:
  verified: {{ .verified | default false }}
  schemaVersion: {{ $contract.schemaVersion }}
  iam:
{{ $contract.iam | toYaml | indent 4 }}
{{- end }}
{{- end }}
