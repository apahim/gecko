{{- if .Values.platformRoles.enabled }}
apiVersion: gcp.managed.openshift.io/v1
kind: PlatformRole
metadata:
  name: service-admin
  annotations:
    # PlatformRole is served by the platform-api-server aggregated API.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  permissions:
    - rolebinding.create
    - rolebinding.list
    - rolebinding.get
    - rolebinding.update
    - rolebinding.delete
    - role.create
    - role.list
    - role.get
    - role.update
    - role.delete
{{- end }}
