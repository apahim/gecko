# Enable only after the regional API LIST/WATCH contract and Pub/Sub resources
# have been verified for this environment. Follower write guards must be active
# before follower consumption is enabled. The first-stage follower relies on
# periodic inventories to repair stale post-delete deliveries until durable
# per-key delete ordering is implemented.
enabled: false

region: ""
leaderRegion: ""
leaderGeneration: 0
replicate: roles.gcp.managed.openshift.io,rolebindings.gcp.managed.openshift.io
resyncInterval: 30m
# Budget per capture, measured as the sum of encoded event sizes. A follower
# may stage two captures per resource kind. With the two default kinds, the
# combined accounting limit is 128 MiB. Actual memory also includes maps,
# temporary allocations, and Go runtime overhead.
captureMaxBytes: 33554432

pubsub:
  # Shared service project that owns the data and control topics.
  topicProjectId: ""
  # This region's project where Config Connector creates subscriptions.
  subscriptionProjectId: ""
  dataTopic: resource-replication-data
  controlTopic: resource-replication-control
  # Each region owns a data subscription, including the leader.
  dataSubscription: ""
  # Each region owns a control subscription for possible promotion.
  controlSubscription: ""
  # Optional chart ownership; Terraform owns the topics in current environments.
  topicOwner: false
  # Config Connector manages publisher IAM on the shared topics when enabled.
  # Terraform grants it topic-scoped IAM access first.
  manageTopicIAM: true

# gecko-cloud-resources creates the regional GSA and Workload Identity binding.
identity:
  # Project and unique GCP service account ID (6-30 chars) for this region's controller.
  projectId: ""
  accountId: ""

image:
  registry: us-docker.pkg.dev
  repository: gcp-hcp-commons/gcp-hcp-images/gecko-controllers
  tag: ""
  pullPolicy: Always

# Each region runs one replication controller, whether leader or follower.
replicaCount: 1
logLevel: info
logFormat: json
orlopURL: ""

serviceAccount:
  name: ""

resources:
  limits:
    cpu: 500m
    # Allow for concurrent follower captures (up to four at defaults),
    # temporary snapshot processing, and Go runtime overhead.
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
imagePullSecrets: []
