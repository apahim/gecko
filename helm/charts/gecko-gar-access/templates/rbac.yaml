{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gecko-gar-access.fullname" . }}
  labels:
    {{- include "gecko-gar-access.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gcp.managed.openshift.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gecko-gar-access.fullname" . }}
  labels:
    {{- include "gecko-gar-access.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gecko-gar-access.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gecko-gar-access.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gecko-gar-access.fullname" . }}
  namespace: {{ .Values.garAccess.iamNamespace }}
  labels:
    {{- include "gecko-gar-access.labels" . | nindent 4 }}
rules:
  - apiGroups: ["iam.cnrm.cloud.google.com"]
    resources: ["iampolicymembers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gecko-gar-access.fullname" . }}
  namespace: {{ .Values.garAccess.iamNamespace }}
  labels:
    {{- include "gecko-gar-access.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gecko-gar-access.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gecko-gar-access.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
